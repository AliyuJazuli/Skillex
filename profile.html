    <style>
      body[data-page-loading="true"] > :not(.page-skeleton) { visibility: hidden !important; }
      .page-skeleton { position: fixed; inset: 0; z-index: 5000; display: block; overflow: auto; background: #f7f7f2; color: #182b25; font: 16px/1.5 "DM Sans", "Segoe UI", sans-serif; }
      .page-skeleton[data-visible="false"] { display: none; }
      .page-skeleton__top, .page-skeleton__nav, .page-skeleton__main { width: min(1200px, calc(100% - 3rem)); margin-inline: auto; }
      .page-skeleton__top { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; border-bottom: 1px solid #dfe7df; }
      .page-skeleton__brand, .page-skeleton__nav, .page-skeleton__chips, .page-skeleton__actions { display: flex; align-items: center; gap: .75rem; }
      .page-skeleton__nav { min-height: 58px; justify-content: center; }
      .page-skeleton__block { display: block; min-width: 0; border-radius: .65rem; background: linear-gradient(100deg,#e9eee9 20%,#f4f6f2 42%,#e9eee9 64%); background-size: 220% 100%; animation: page-skeleton-shimmer 1.8s ease-in-out infinite; }
      .page-skeleton__block--logo { width: 2.2rem; height: 2.2rem; border-radius: .7rem; }
      .page-skeleton__block--brand-name { width: 5rem; height: 1.1rem; }
      .page-skeleton__block--action { width: 5rem; height: 2.6rem; border-radius: .8rem; }
      .page-skeleton__block--nav-item { width: 5.2rem; height: 2rem; border-radius: 999px; }
      .page-skeleton__main { padding-block: 2.5rem 4rem; }
      @keyframes page-skeleton-shimmer { to { background-position-x: -220%; } }
      @media (max-width: 760px) {
        .page-skeleton__top, .page-skeleton__nav, .page-skeleton__main { width: calc(100% - 2.25rem); }
        .page-skeleton__top { min-height: 68px; }
        .page-skeleton__nav { justify-content: flex-start; overflow: hidden; }
        .page-skeleton__nav .page-skeleton__block--nav-item:nth-child(n + 5) { display: none; }
        .page-skeleton__main { padding-block: 2rem 3.5rem; }
      }
      @media (prefers-reduced-motion: reduce) { .page-skeleton__block { animation: none; } }
      html.dark .page-skeleton { background: #111b17; color: #eef4ef; }
      html.dark .page-skeleton__block { background: linear-gradient(100deg,#21332b 20%,#34483e 42%,#21332b 64%); background-size: 220% 100%; }
    </style>    <link rel="stylesheet" href="css/style.css" />

  <body>
    <script src="js/page-skeleton.js"></script>
    <header class="site-header">
      <nav class="navbar container">
        <a href="index.html" class="logo">Skillex</a>
        <div class="nav-actions">
          <button class="theme-toggle" type="button" aria-label="Toggle color theme">
            <span class="theme-toggle__icon">☀️</span>
          </button>
          <a href="dashboard.html" class="btn btn-sm">Dashboard</a>
        </div>
      </nav>
    </header>

    <main class="container page-shell">
      <section class="page-hero">
        <p class="eyebrow" data-cms-key="hero-eyebrow" data-cms-label="Profile eyebrow">Profile settings</p>
        <h1 data-cms-key="hero-title" data-cms-label="Profile heading">Keep your learning profile up to date.</h1>
      </section>

      <section class="auth-card profile-card">
        <form class="contact-form" id="profile-form">
          <div class="profile-photo-row">
            <img id="profile-photo-preview" class="profile-photo" alt="Your profile preview" />
            <div class="profile-photo-picker">
              <p>Profile picture</p>
              <p class="muted">PNG, JPEG, or WebP, up to 5 MB.</p>
              <input type="file" id="profile-photo-input" accept="image/png,image/jpeg,image/webp" hidden />
              <button class="btn btn-small" id="choose-profile-photo" type="button">Choose photo</button>
              <p class="form-status" id="profile-photo-status" role="status" aria-live="polite"></p>
            </div>
          </div>
          <label>
            Full name
            <input type="text" name="name" required />
          </label>
          <label>
            Email
            <input type="email" name="email" required />
          </label>
          <label>
            Bio
            <textarea name="bio" rows="4"></textarea>
          </label>
          <label>
            I want to learn
            <input type="text" name="learnGoals" placeholder="e.g. JavaScript, photography" />
          </label>
          <label>
            I can teach
            <input type="text" name="teachGoals" placeholder="e.g. HTML, public speaking" />
          </label>
          <button class="btn" type="submit">Save profile</button>
          <p class="form-status" id="profile-status" role="status" aria-live="polite"></p>
        </form>
        <button class="btn btn-secondary" id="logout-btn" type="button">Logout</button>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <div class="footer-brand">
          <p class="footer-copyright">&copy; 2026 Skillex. All rights reserved.</p>
          <a class="footer-hydev" href="https://aliyujazuli.netlify.app/" aria-label="Visit Aliyu Muhammad Jazuli's website">
            <img src="assets/hydev-logo-tile.png" alt="" width="116" height="90" loading="lazy" decoding="async" />
          </a>
          <p class="footer-attribution">Skillex &mdash; A HYDEV product</p>
        </div>
      </div>
    </footer>

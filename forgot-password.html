<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skillex | Reset password</title>
    <meta name="description" content="Request a secure password reset link for your Skillex account." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="assets/favicon.ico" sizes="any" />
    <link rel="icon" href="assets/skillex-logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/skillex-icon-180.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="canonical" href="https://skillex-hydev.netlify.app/forgot-password.html" />
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container">
        <a href="index.html" class="logo">Skillex</a>
        <div class="nav-actions">
          <button class="theme-toggle" type="button" aria-label="Toggle color theme"><span class="theme-toggle__icon">☀️</span></button>
        </div>
      </nav>
    </header>

    <main class="container page-shell auth-shell">
      <section class="auth-card">
        <p class="eyebrow">Account recovery</p>
        <h1>Forgot your password?</h1>
        <p>Enter your account email and we’ll send a secure link to choose a new password.</p>
        <form class="contact-form auth-form" id="forgot-password-form">
          <label>
            Email
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <button class="btn" type="submit">Send reset link</button>
          <p class="form-status" id="forgot-password-status" role="status" aria-live="polite"></p>
        </form>
        <p class="auth-link"><a href="login.html">Back to login</a></p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <div class="footer-brand">
          <p class="footer-built-by">BUILT BY</p>
          <a class="footer-hydev" href="https://aliyujazuli.netlify.app" target="_blank" rel="noopener noreferrer" aria-label="Visit the HYDEV ecosystem">
            <img src="assets/hydev-logo-tile.png" alt="HYDEV" width="116" height="90" />
          </a>
          <p class="footer-copyright">&copy; 2026 Skillex. All rights reserved.</p>
          <p class="footer-attribution">Skillex — A HYDEV product</p>
          <a href="privacy.html">Privacy Policy</a>
        </div>
      </div>
    </footer>

    <script src="js/navigation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/backend.js"></script>
    <script src="js/modules/learning-data.js"></script>
    <script src="js/modules/learning-ui.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
